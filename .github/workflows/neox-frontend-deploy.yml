name: Neox Frontend Deploy

on:
  workflow_run:
    workflows:
      - Release Gate
    types:
      - completed

permissions:
  contents: read

jobs:
  trigger-neox-frontend-cloudflare-pages-deploy:
    name: Trigger Neox Frontend Cloudflare deploy
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Trigger Cloudflare Pages deploy for Neox frontend
        env:
          CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK is missing." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK"

      - name: Summarize Neox frontend deploy trigger
        if: always()
        shell: bash
        run: |
          {
            echo "## Neox Frontend Cloudflare deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source workflow | \`${{ github.event.workflow_run.name }}\` |"
            echo "| Source conclusion | \`${{ github.event.workflow_run.conclusion }}\` |"
            echo "| Branch | \`${{ github.event.workflow_run.head_branch }}\` |"
            echo "| Event | \`${{ github.event.workflow_run.event }}\` |"
            echo "| Deploy hook configured | \`${CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK:+true}\` |"
          } >> "$GITHUB_STEP_SUMMARY"