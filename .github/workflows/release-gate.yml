name: Release Gate

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  workspace-startup-compat-node18:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Node 18 workspace startup compatibility
        run: npm run check:workspace-startup-compat

  frontend-stable-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      VITE_API_BASE: https://api.example.com
      VITE_WS_URL: wss://api.example.com/ws
      VITE_ENABLE_INTERNAL_ROUTES: "0"
      VITE_DEBUG_PUSH: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report current verification status
        run: npm run verify:env:status

      - name: Validate frontend environment
        run: npm run validate:env -w ai-hq-frontend

      - name: Prepare frontend test result directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ai-hq-frontend/test-results | Out-Null

      - name: Run frontend stable tests on Windows
        id: frontend_stable_windows
        run: npm run test:frontend:stable:ci

      - name: Inspect Windows frontend test outputs
        id: inspect_frontend_windows_outputs
        if: always()
        shell: pwsh
        run: |
          $contractsJunit = Test-Path "ai-hq-frontend/test-results/frontend-contracts.junit.xml"
          $smokeHooksJunit = Test-Path "ai-hq-frontend/test-results/frontend-smoke-hooks.junit.xml"
          $smokeUiJunitFiles = Get-ChildItem -Path "ai-hq-frontend/test-results" -Filter "frontend-smoke-ui-*.junit.xml" -ErrorAction SilentlyContinue
          $smokeUiJunit = @($smokeUiJunitFiles).Count -gt 0
          $contractsJson = Test-Path "ai-hq-frontend/test-results/frontend-contracts.json"
          $smokeHooksJson = Test-Path "ai-hq-frontend/test-results/frontend-smoke-hooks.json"
          $smokeUiJsonFiles = Get-ChildItem -Path "ai-hq-frontend/test-results" -Filter "frontend-smoke-ui-*.json" -ErrorAction SilentlyContinue
          $smokeUiJson = @($smokeUiJsonFiles).Count -gt 0
          "contracts_junit=$contractsJunit" >> $env:GITHUB_OUTPUT
          "smoke_hooks_junit=$smokeHooksJunit" >> $env:GITHUB_OUTPUT
          "smoke_ui_junit=$smokeUiJunit" >> $env:GITHUB_OUTPUT
          "contracts_json=$contractsJson" >> $env:GITHUB_OUTPUT
          "smoke_hooks_json=$smokeHooksJson" >> $env:GITHUB_OUTPUT
          "smoke_ui_json=$smokeUiJson" >> $env:GITHUB_OUTPUT
          $hasJunit = $contractsJunit -or $smokeHooksJunit -or $smokeUiJunit
          $hasJson = $contractsJson -or $smokeHooksJson -or $smokeUiJson
          "has_junit=$hasJunit" >> $env:GITHUB_OUTPUT
          "has_json=$hasJson" >> $env:GITHUB_OUTPUT

      - name: Upload Windows frontend test results
        id: upload_frontend_windows_results
        if: always() && (steps.inspect_frontend_windows_outputs.outputs.has_junit == 'true' || steps.inspect_frontend_windows_outputs.outputs.has_json == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-stable-windows-test-results
          path: ai-hq-frontend/test-results
          if-no-files-found: warn

      - name: Publish Windows frontend stable test report
        id: publish_frontend_windows_report
        if: always() && steps.inspect_frontend_windows_outputs.outputs.has_junit == 'true'
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "ai-hq-frontend/test-results/*.junit.xml"
          check_name: "Frontend Stable Tests (Windows)"
          require_tests: true
          detailed_summary: true
          include_passed: false
          annotate_only: false

      - name: Summarize Windows frontend stable results
        if: always()
        shell: pwsh
        run: |
          @"
          ## Frontend Stable Tests (Windows)

          | Item | Status |
          | --- | --- |
          | Stable test command | `${{ steps.frontend_stable_windows.outcome }}` |
          | JUnit publish step | `${{ steps.publish_frontend_windows_report.outcome }}` |
          | Artifact upload step | `${{ steps.upload_frontend_windows_results.outcome }}` |
          | Contracts JUnit file | `${{ steps.inspect_frontend_windows_outputs.outputs.contracts_junit }}` |
          | Smoke hooks JUnit file | `${{ steps.inspect_frontend_windows_outputs.outputs.smoke_hooks_junit }}` |
          | Smoke UI JUnit shards present | `${{ steps.inspect_frontend_windows_outputs.outputs.smoke_ui_junit }}` |
          | Contracts JSON file | `${{ steps.inspect_frontend_windows_outputs.outputs.contracts_json }}` |
          | Smoke hooks JSON file | `${{ steps.inspect_frontend_windows_outputs.outputs.smoke_hooks_json }}` |
          | Smoke UI JSON shards present | `${{ steps.inspect_frontend_windows_outputs.outputs.smoke_ui_json }}` |

          Checks:
          - `Frontend Stable Tests (Windows)` for file-level failures and test names

          Artifacts:
          - `frontend-stable-windows-test-results` for JUnit and JSON outputs

          Deeper inspection:
          - Open the Windows frontend check for direct failing test/file visibility
          - Download the Windows artifact if you need the raw JUnit or JSON payloads
          "@ >> $env:GITHUB_STEP_SUMMARY

  monorepo-release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: aihq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d aihq_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      PORT: "8080"
      CORS_ORIGIN: https://app.example.com
      PUBLIC_BASE_URL: https://api.example.com
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/aihq_ci
      WS_AUTH_TOKEN: ci-ws-token
      OPENAI_API_KEY: ci-openai-key
      OPENAI_REALTIME_MODEL: gpt-4o-realtime-preview
      OPENAI_REALTIME_VOICE: alloy
      ADMIN_SESSION_SECRET: ci-admin-session-secret
      USER_SESSION_SECRET: ci-user-session-secret
      AIHQ_INTERNAL_TOKEN: ci-internal-token
      DEBUG_API_TOKEN: ci-debug-token
      CRON_SECRET: ci-cron-secret
      TENANT_SECRET_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      VAPID_PUBLIC_KEY: BElCiExamplePublicKey1234567890abcdefghijklmnop
      VAPID_PRIVATE_KEY: ci-vapid-private-key
      VAPID_SUBJECT: mailto:platform@example.com
      VERIFY_TOKEN: ci-meta-verify-token
      META_APP_ID: "123456789012345"
      META_APP_SECRET: ci-meta-app-secret
      META_WEBHOOK_APP_SECRET: ci-meta-app-secret
      META_REDIRECT_URI: https://api.example.com/oauth/meta/callback
      AIHQ_BASE_URL: https://aihq.example.com
      CONTACT_EMAIL: platform@example.com
      TWILIO_ACCOUNT_SID: TWILIO_ACCOUNT_SID_PLACEHOLDER
      TWILIO_API_KEY: TWILIO_API_KEY_PLACEHOLDER
      TWILIO_API_SECRET: TWILIO_API_SECRET_PLACEHOLDER
      TWILIO_TWIML_APP_SID: TWILIO_TWIML_APP_SID_PLACEHOLDER
      TWILIO_AUTH_TOKEN: TWILIO_AUTH_TOKEN_PLACEHOLDER
      TWILIO_CALLER_ID: TWILIO_CALLER_ID_PLACEHOLDER
      VITE_API_BASE: https://api.example.com
      VITE_WS_URL: wss://api.example.com/ws
      VITE_ENABLE_INTERNAL_ROUTES: "0"
      VITE_DEBUG_PUSH: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dependency vulnerability audit
        run: npm run security:audit

      - name: Run static secret scan
        run: npm run security:scan

      - name: Report current verification status
        run: npm run verify:env:status

      - name: Validate environment
        run: npm run validate:env

      - name: Apply AI HQ migrations
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/aihq_ci
        run: npm run migrate:ai-hq-backend

      - name: Run AI HQ DB-backed integration harness against CI Postgres
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/aihq_ci
          AIHQ_DB_HARNESS_SKIP_MIGRATE: "1"
        run: npm run test:aihq:db

      - name: Check operational readiness
        run: npm run check:operational-readiness

      - name: Lint all workspaces
        run: npm run lint:all

      - name: Prepare frontend test result directory
        run: mkdir -p ai-hq-frontend/test-results

      - name: Run frontend stable tests on Linux
        id: frontend_stable_linux
        run: npm run test:frontend:stable:ci

      - name: Inspect Linux frontend test outputs
        id: inspect_frontend_linux_outputs
        if: always()
        shell: pwsh
        run: |
          $contractsJunit = Test-Path "ai-hq-frontend/test-results/frontend-contracts.junit.xml"
          $smokeHooksJunit = Test-Path "ai-hq-frontend/test-results/frontend-smoke-hooks.junit.xml"
          $smokeUiJunitFiles = Get-ChildItem -Path "ai-hq-frontend/test-results" -Filter "frontend-smoke-ui-*.junit.xml" -ErrorAction SilentlyContinue
          $smokeUiJunit = @($smokeUiJunitFiles).Count -gt 0
          $contractsJson = Test-Path "ai-hq-frontend/test-results/frontend-contracts.json"
          $smokeHooksJson = Test-Path "ai-hq-frontend/test-results/frontend-smoke-hooks.json"
          $smokeUiJsonFiles = Get-ChildItem -Path "ai-hq-frontend/test-results" -Filter "frontend-smoke-ui-*.json" -ErrorAction SilentlyContinue
          $smokeUiJson = @($smokeUiJsonFiles).Count -gt 0
          "contracts_junit=$contractsJunit" >> $env:GITHUB_OUTPUT
          "smoke_hooks_junit=$smokeHooksJunit" >> $env:GITHUB_OUTPUT
          "smoke_ui_junit=$smokeUiJunit" >> $env:GITHUB_OUTPUT
          "contracts_json=$contractsJson" >> $env:GITHUB_OUTPUT
          "smoke_hooks_json=$smokeHooksJson" >> $env:GITHUB_OUTPUT
          "smoke_ui_json=$smokeUiJson" >> $env:GITHUB_OUTPUT
          $hasJunit = $contractsJunit -or $smokeHooksJunit -or $smokeUiJunit
          $hasJson = $contractsJson -or $smokeHooksJson -or $smokeUiJson
          "has_junit=$hasJunit" >> $env:GITHUB_OUTPUT
          "has_json=$hasJson" >> $env:GITHUB_OUTPUT

      - name: Upload Linux frontend test results
        id: upload_frontend_linux_results
        if: always() && (steps.inspect_frontend_linux_outputs.outputs.has_junit == 'true' || steps.inspect_frontend_linux_outputs.outputs.has_json == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-stable-linux-test-results
          path: ai-hq-frontend/test-results
          if-no-files-found: warn

      - name: Publish Linux frontend stable test report
        id: publish_frontend_linux_report
        if: always() && steps.inspect_frontend_linux_outputs.outputs.has_junit == 'true'
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "ai-hq-frontend/test-results/*.junit.xml"
          check_name: "Frontend Stable Tests (Linux)"
          require_tests: true
          detailed_summary: true
          include_passed: false
          annotate_only: false

      - name: Summarize Linux frontend stable results
        if: always()
        shell: pwsh
        run: |
          @"
          ## Frontend Stable Tests (Linux)

          | Item | Status |
          | --- | --- |
          | Stable test command | `${{ steps.frontend_stable_linux.outcome }}` |
          | JUnit publish step | `${{ steps.publish_frontend_linux_report.outcome }}` |
          | Artifact upload step | `${{ steps.upload_frontend_linux_results.outcome }}` |
          | Contracts JUnit file | `${{ steps.inspect_frontend_linux_outputs.outputs.contracts_junit }}` |
          | Smoke hooks JUnit file | `${{ steps.inspect_frontend_linux_outputs.outputs.smoke_hooks_junit }}` |
          | Smoke UI JUnit shards present | `${{ steps.inspect_frontend_linux_outputs.outputs.smoke_ui_junit }}` |
          | Contracts JSON file | `${{ steps.inspect_frontend_linux_outputs.outputs.contracts_json }}` |
          | Smoke hooks JSON file | `${{ steps.inspect_frontend_linux_outputs.outputs.smoke_hooks_json }}` |
          | Smoke UI JSON shards present | `${{ steps.inspect_frontend_linux_outputs.outputs.smoke_ui_json }}` |

          Checks:
          - `Frontend Stable Tests (Linux)` for file-level failures and test names

          Artifacts:
          - `frontend-stable-linux-test-results` for JUnit and JSON outputs

          Deeper inspection:
          - Open the Linux frontend check for direct failing test/file visibility
          - Download the Linux artifact if you need the raw JUnit or JSON payloads
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Run test gate
        run: npm run test:backend:all

      - name: Run build gate
        run: npm run build:all

      - name: Build Twilio voice backend Docker image
        run: docker build -f twilio-voice-backend/Dockerfile .

  production-security-preflight:
    name: Validate production security env
    runs-on: ubuntu-latest
    needs:
      - workspace-startup-compat-node18
      - monorepo-release-gate
      - frontend-stable-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run production placeholder guard
        env:
          AIHQ_PROD_BASE_URL: ${{ secrets.AIHQ_PROD_BASE_URL }}
          AIHQ_PROD_INTERNAL_TOKEN: ${{ secrets.AIHQ_PROD_INTERNAL_TOKEN }}
          AIHQ_FRONTEND_PROD_URL: ${{ secrets.AIHQ_FRONTEND_PROD_URL }}
          META_BOT_PROD_BASE_URL: ${{ secrets.META_BOT_PROD_BASE_URL }}
          TWILIO_VOICE_PROD_BASE_URL: ${{ secrets.TWILIO_VOICE_PROD_BASE_URL }}
          WEBSITE_LANE_TENANT_KEY: ${{ secrets.WEBSITE_LANE_TENANT_KEY }}
          RAILWAY_AIHQ_BACKEND_DEPLOY_HOOK: ${{ secrets.RAILWAY_AIHQ_BACKEND_DEPLOY_HOOK }}
          RAILWAY_META_BOT_BACKEND_DEPLOY_HOOK: ${{ secrets.RAILWAY_META_BOT_BACKEND_DEPLOY_HOOK }}
          RAILWAY_TWILIO_VOICE_BACKEND_DEPLOY_HOOK: ${{ secrets.RAILWAY_TWILIO_VOICE_BACKEND_DEPLOY_HOOK }}
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
          AIHQ_EXPECTED_RELEASE_SHA: ${{ github.sha }}
          POSTDEPLOY_REQUIRE_WEBSITE_LANE: "1"
          PROD_SPINE_REQUIRE_WEBSITE_LANE: "1"
          POSTDEPLOY_STRICT_SIDECARS: "1"
          PROD_SPINE_STRICT_SIDECARS: "1"
          AIHQ_FRONTEND_PROD_SMOKE_REQUIRE_RELEASE_SHA: "1"
          PROD_SPINE_REQUIRE_RELEASE_SHA: "1"
        run: npm run security:placeholder-guard

      - name: Summarize production security preflight
        if: always()
        shell: bash
        run: |
          {
            echo "## Production security preflight"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Placeholder guard | \`${{ job.status }}\` |"
            echo "| Deploy hook/env placeholders rejected | \`true\` |"
            echo "| Strict sidecars required | \`true\` |"
            echo "| Release SHA required | \`true\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-ai-hq-backend-railway-deploy:
    name: Trigger AI HQ backend Railway deploy
    runs-on: ubuntu-latest
    needs:
      - workspace-startup-compat-node18
      - monorepo-release-gate
      - frontend-stable-windows
      - production-security-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger AI HQ backend Railway production deploy
        id: trigger_aihq_backend_railway_deploy
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_AIHQ_BACKEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$RAILWAY_DEPLOY_HOOK" ]; then
            echo "RAILWAY_AIHQ_BACKEND_DEPLOY_HOOK is missing for the AI HQ backend Railway service." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$RAILWAY_DEPLOY_HOOK"

      - name: Summarize AI HQ backend Railway deploy trigger
        if: always()
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_AIHQ_BACKEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          {
            echo "## AI HQ backend Railway deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Railway service | \`AI HQ backend\` |"
            echo "| Deploy hook secret | \`RAILWAY_AIHQ_BACKEND_DEPLOY_HOOK\` |"
            echo "| Deploy hook trigger | \`${{ steps.trigger_aihq_backend_railway_deploy.outcome }}\` |"
            echo "| Deploy hook configured | \`${RAILWAY_DEPLOY_HOOK:+true}\` |"
            echo "| Release boundary | \`workspace-startup-compat-node18 + monorepo-release-gate + frontend-stable-windows + production-security-preflight\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-meta-bot-backend-railway-deploy:
    name: Trigger Meta bot backend Railway deploy
    runs-on: ubuntu-latest
    needs:
      - workspace-startup-compat-node18
      - monorepo-release-gate
      - frontend-stable-windows
      - production-security-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Meta bot backend Railway production deploy
        id: trigger_meta_bot_backend_railway_deploy
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_META_BOT_BACKEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$RAILWAY_DEPLOY_HOOK" ]; then
            echo "RAILWAY_META_BOT_BACKEND_DEPLOY_HOOK is missing for the Meta bot backend Railway service." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$RAILWAY_DEPLOY_HOOK"

      - name: Summarize Meta bot backend Railway deploy trigger
        if: always()
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_META_BOT_BACKEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          {
            echo "## Meta bot backend Railway deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Railway service | \`Meta bot backend\` |"
            echo "| Deploy hook secret | \`RAILWAY_META_BOT_BACKEND_DEPLOY_HOOK\` |"
            echo "| Deploy hook trigger | \`${{ steps.trigger_meta_bot_backend_railway_deploy.outcome }}\` |"
            echo "| Deploy hook configured | \`${RAILWAY_DEPLOY_HOOK:+true}\` |"
            echo "| Release boundary | \`workspace-startup-compat-node18 + monorepo-release-gate + frontend-stable-windows + production-security-preflight\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-twilio-voice-backend-railway-deploy:
    name: Trigger Twilio voice backend Railway deploy
    runs-on: ubuntu-latest
    needs:
      - workspace-startup-compat-node18
      - monorepo-release-gate
      - frontend-stable-windows
      - production-security-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Twilio voice backend Railway production deploy
        id: trigger_twilio_voice_backend_railway_deploy
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_TWILIO_VOICE_BACKEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$RAILWAY_DEPLOY_HOOK" ]; then
            echo "RAILWAY_TWILIO_VOICE_BACKEND_DEPLOY_HOOK is missing for the Twilio voice backend Railway service." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$RAILWAY_DEPLOY_HOOK"

      - name: Summarize Twilio voice backend Railway deploy trigger
        if: always()
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_TWILIO_VOICE_BACKEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          {
            echo "## Twilio voice backend Railway deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Railway service | \`Twilio voice backend\` |"
            echo "| Deploy hook secret | \`RAILWAY_TWILIO_VOICE_BACKEND_DEPLOY_HOOK\` |"
            echo "| Deploy hook trigger | \`${{ steps.trigger_twilio_voice_backend_railway_deploy.outcome }}\` |"
            echo "| Deploy hook configured | \`${RAILWAY_DEPLOY_HOOK:+true}\` |"
            echo "| Release boundary | \`workspace-startup-compat-node18 + monorepo-release-gate + frontend-stable-windows + production-security-preflight\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-ai-hq-frontend-cloudflare-pages-deploy:
    name: Trigger AI HQ frontend Cloudflare Pages deploy
    runs-on: ubuntu-latest
    needs:
      - workspace-startup-compat-node18
      - monorepo-release-gate
      - frontend-stable-windows
      - production-security-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger AI HQ frontend Cloudflare Pages production deploy
        id: trigger_aihq_frontend_pages_deploy
        env:
          CLOUDFLARE_AIHQ_FRONTEND_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_AIHQ_FRONTEND_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK is missing for the AI HQ frontend Cloudflare Pages project." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$CLOUDFLARE_AIHQ_FRONTEND_DEPLOY_HOOK"

      - name: Summarize AI HQ frontend deploy trigger
        if: always()
        env:
          CLOUDFLARE_AIHQ_FRONTEND_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        shell: bash
        run: |
          {
            echo "## AI HQ frontend Cloudflare deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Cloudflare project | \`AI HQ frontend\` |"
            echo "| Cloudflare build command | \`npm run build:ai-hq-frontend\` |"
            echo "| Cloudflare output directory | \`ai-hq-frontend/dist\` |"
            echo "| Deploy hook secret | \`CLOUDFLARE_PAGES_DEPLOY_HOOK\` |"
            echo "| Deploy hook trigger | \`${{ steps.trigger_aihq_frontend_pages_deploy.outcome }}\` |"
            echo "| Deploy hook configured | \`${CLOUDFLARE_AIHQ_FRONTEND_DEPLOY_HOOK:+true}\` |"
            echo "| Release boundary | \`workspace-startup-compat-node18 + monorepo-release-gate + frontend-stable-windows + production-security-preflight\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-neox-frontend-cloudflare-pages-deploy:
    name: Trigger Neox frontend Cloudflare Pages deploy
    runs-on: ubuntu-latest
    needs:
      - workspace-startup-compat-node18
      - monorepo-release-gate
      - frontend-stable-windows
      - production-security-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Neox frontend Cloudflare Pages production deploy
        id: trigger_neox_frontend_pages_deploy
        env:
          CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK is missing for the Neox frontend Cloudflare Pages project." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK"

      - name: Summarize Neox frontend deploy trigger
        if: always()
        env:
          CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          {
            echo "## Neox frontend Cloudflare deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Cloudflare project | \`Neox frontend\` |"
            echo "| Cloudflare build command | \`npm run build:neox-frontend\` |"
            echo "| Cloudflare output directory | \`neox-frontend/dist\` |"
            echo "| Deploy hook secret | \`CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK\` |"
            echo "| Deploy hook trigger | \`${{ steps.trigger_neox_frontend_pages_deploy.outcome }}\` |"
            echo "| Deploy hook configured | \`${CLOUDFLARE_NEOX_FRONTEND_DEPLOY_HOOK:+true}\` |"
            echo "| Release boundary | \`workspace-startup-compat-node18 + monorepo-release-gate + frontend-stable-windows + production-security-preflight\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-production-post-deploy:
    name: Verify production deploy after gated hooks
    runs-on: ubuntu-latest
    needs:
      - trigger-ai-hq-backend-railway-deploy
      - trigger-meta-bot-backend-railway-deploy
      - trigger-twilio-voice-backend-railway-deploy
      - trigger-ai-hq-frontend-cloudflare-pages-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production verification secrets
        env:
          AIHQ_BASE_URL: ${{ secrets.AIHQ_PROD_BASE_URL }}
          AIHQ_INTERNAL_TOKEN: ${{ secrets.AIHQ_PROD_INTERNAL_TOKEN }}
          AIHQ_FRONTEND_PROD_URL: ${{ secrets.AIHQ_FRONTEND_PROD_URL }}
          META_BOT_BASE_URL: ${{ secrets.META_BOT_PROD_BASE_URL }}
          TWILIO_VOICE_BASE_URL: ${{ secrets.TWILIO_VOICE_PROD_BASE_URL }}
          WEBSITE_LANE_TENANT_KEY: ${{ secrets.WEBSITE_LANE_TENANT_KEY }}
        shell: bash
        run: |
          missing=0

          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "$name is required for strict production post-deploy verification." >&2
              missing=1
            fi
          }

          require_secret "AIHQ_PROD_BASE_URL" "$AIHQ_BASE_URL"
          require_secret "AIHQ_PROD_INTERNAL_TOKEN" "$AIHQ_INTERNAL_TOKEN"
          require_secret "AIHQ_FRONTEND_PROD_URL" "$AIHQ_FRONTEND_PROD_URL"
          require_secret "META_BOT_PROD_BASE_URL" "$META_BOT_BASE_URL"
          require_secret "TWILIO_VOICE_PROD_BASE_URL" "$TWILIO_VOICE_BASE_URL"
          require_secret "WEBSITE_LANE_TENANT_KEY" "$WEBSITE_LANE_TENANT_KEY"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Playwright Chromium for frontend production smoke
        run: npx playwright install --with-deps chromium

      - name: Run AI HQ frontend production browser smoke
        id: frontend_prod_smoke
        env:
          AIHQ_FRONTEND_PROD_URL: ${{ secrets.AIHQ_FRONTEND_PROD_URL }}
          AIHQ_EXPECTED_RELEASE_SHA: ${{ github.sha }}
          AIHQ_FRONTEND_SMOKE_USER_SESSION_COOKIE: ${{ secrets.AIHQ_PROD_USER_SESSION_COOKIE }}
          AIHQ_FRONTEND_SMOKE_USER_SESSION_TOKEN: ${{ secrets.AIHQ_PROD_USER_SESSION_TOKEN }}
          AIHQ_FRONTEND_PROD_SMOKE_ATTEMPTS: "8"
          AIHQ_FRONTEND_PROD_SMOKE_DELAY_MS: "15000"
          AIHQ_FRONTEND_PROD_SMOKE_TIMEOUT_MS: "25000"
          AIHQ_FRONTEND_PROD_SMOKE_REQUIRE_RELEASE_SHA: "1"
        shell: bash
        run: npm run ops:frontend:prod-smoke

      - name: Run mandatory production prod-spine smoke with strict sidecars
        id: prod_spine_smoke
        env:
          AIHQ_BASE_URL: ${{ secrets.AIHQ_PROD_BASE_URL }}
          AIHQ_INTERNAL_TOKEN: ${{ secrets.AIHQ_PROD_INTERNAL_TOKEN }}
          AIHQ_EXPECTED_RELEASE_SHA: ${{ github.sha }}
          AIHQ_LAUNCH_POSTURE_TENANT_KEY: ${{ secrets.AIHQ_LAUNCH_POSTURE_TENANT_KEY }}
          AIHQ_USER_SESSION_COOKIE: ${{ secrets.AIHQ_PROD_USER_SESSION_COOKIE }}
          AIHQ_USER_SESSION_TOKEN: ${{ secrets.AIHQ_PROD_USER_SESSION_TOKEN }}
          META_BOT_BASE_URL: ${{ secrets.META_BOT_PROD_BASE_URL }}
          TWILIO_VOICE_BASE_URL: ${{ secrets.TWILIO_VOICE_PROD_BASE_URL }}
          WEBSITE_LANE_TENANT_KEY: ${{ secrets.WEBSITE_LANE_TENANT_KEY }}
          WEBSITE_LANE_DOMAIN: ${{ secrets.WEBSITE_LANE_DOMAIN }}
          PROD_SPINE_SMOKE_ATTEMPTS: "8"
          PROD_SPINE_SMOKE_DELAY_MS: "15000"
          PROD_SPINE_TIMEOUT_MS: "12000"
          PROD_SPINE_STRICT_SIDECARS: "1"
          PROD_SPINE_REQUIRE_WEBSITE_LANE: "1"
          PROD_SPINE_REQUIRE_RELEASE_SHA: "1"
          PROD_SPINE_FAIL_ON_DEGRADED: "1"
        shell: bash
        run: npm run ops:prod-spine:smoke

      - name: Run mandatory production post-deploy verification with strict sidecars
        id: postdeploy_verify
        env:
          AIHQ_BASE_URL: ${{ secrets.AIHQ_PROD_BASE_URL }}
          AIHQ_INTERNAL_TOKEN: ${{ secrets.AIHQ_PROD_INTERNAL_TOKEN }}
          AIHQ_LAUNCH_POSTURE_TENANT_KEY: ${{ secrets.AIHQ_LAUNCH_POSTURE_TENANT_KEY }}
          AIHQ_USER_SESSION_COOKIE: ${{ secrets.AIHQ_PROD_USER_SESSION_COOKIE }}
          AIHQ_USER_SESSION_TOKEN: ${{ secrets.AIHQ_PROD_USER_SESSION_TOKEN }}
          META_BOT_BASE_URL: ${{ secrets.META_BOT_PROD_BASE_URL }}
          TWILIO_VOICE_BASE_URL: ${{ secrets.TWILIO_VOICE_PROD_BASE_URL }}
          WEBSITE_LANE_TENANT_KEY: ${{ secrets.WEBSITE_LANE_TENANT_KEY }}
          WEBSITE_LANE_DOMAIN: ${{ secrets.WEBSITE_LANE_DOMAIN }}
          POSTDEPLOY_TIMEOUT_MS: "12000"
          POSTDEPLOY_STRICT_SIDECARS: "1"
          POSTDEPLOY_REQUIRE_WEBSITE_LANE: "1"
          POSTDEPLOY_FAIL_ON_DEGRADED: "1"
        shell: bash
        run: npm run ops:postdeploy:verify

      - name: Summarize strict production post-deploy verification
        if: always()
        shell: bash
        run: |
          {
            echo "## Strict production post-deploy verification"
            echo
            echo "| Item | Status |"
            echo "| --- | --- |"
            echo "| AI HQ backend deploy dependency | \`${{ needs['trigger-ai-hq-backend-railway-deploy'].result }}\` |"
            echo "| Meta bot backend deploy dependency | \`${{ needs['trigger-meta-bot-backend-railway-deploy'].result }}\` |"
            echo "| Twilio voice backend deploy dependency | \`${{ needs['trigger-twilio-voice-backend-railway-deploy'].result }}\` |"
            echo "| AI HQ frontend deploy dependency | \`${{ needs['trigger-ai-hq-frontend-cloudflare-pages-deploy'].result }}\` |"
            echo "| AI HQ frontend browser smoke step | \`${{ steps.frontend_prod_smoke.outcome }}\` |"
            echo "| Prod spine smoke step | \`${{ steps.prod_spine_smoke.outcome }}\` |"
            echo "| Post-deploy verify step | \`${{ steps.postdeploy_verify.outcome }}\` |"
            echo "| Expected release SHA | \`${{ github.sha }}\` |"
            echo "| Release SHA identity checks | \`true\` |"
            echo "| Strict sidecars | \`true\` |"
            echo "| Strict website lane tenant smoke | \`true\` |"
            echo "| Fail on degraded | \`true\` |"
            echo
            echo "Commands:"
            echo
            echo "- \`npm run ops:frontend:prod-smoke\`"
            echo "- \`npm run ops:prod-spine:smoke\`"
            echo "- \`npm run ops:postdeploy:verify\`"
            echo "- \`npm run ops:postdeploy:full\`"
            echo
            echo "Runbooks:"
            echo
            echo "- \`docs/runbooks/production-release-boundary.md\`"
            echo "- \`docs/runbooks/environment-parity-verification.md\`"
            echo "- \`docs/runbooks/post-deploy-verification.md\`"
            echo "- \`docs/runbooks/schema-migration-safety.md\`"
            echo "- \`docs/runbooks/production-rollback.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
